<!DOCTYPE html>

<head>
  <meta charset="utf-8">
  <title>vTools Autofill - Settings</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f8; color: #333; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { border-bottom: 2px solid #006699; padding-bottom: 8px; color: #006699; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
    input[type="text"], input[type="email"], input[type="number"], select, textarea {
      width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
    }
    .row { display: flex; gap: 15px; }
    .col { flex: 1; }
    .checkbox-label { font-weight: normal; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .btn-save { background: #006699; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-save:hover { background: #004b70; }
    #status { margin-top: 10px; color: green; font-weight: bold; display: none; }

    /* Rich Text Editor Styles matching content.js */
    .vtools-rte-wrapper {
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
    }
    .vtools-rte-toolbar {
      background: #f1f3f5;
      border-bottom: 1px solid #ccc;
      padding: 4px;
      display: flex;
      gap: 4px;
    }
    .vtools-rte-toolbar button {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.2;
    }
    .vtools-rte-toolbar button:hover {
      background: #e2e6ea;
    }
    .vtools-rte-content {
      min-height: 80px;
      padding: 8px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .vtools-rte-content:empty:before {
      content: attr(data-placeholder);
      color: #888;
      pointer-events: none;
      display: block;
    }
  </style>
</head>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const regTypeSelect = document.getElementById("opt_reg_type");
      const standardOpts = document.getElementById("standard_reg_opts");

      function updateRegOptionsVisibility() {
        if (regTypeSelect.value === "Standard") {
          standardOpts.style.display = "block";
        } else {
          standardOpts.style.display = "none";
        }
      }

      regTypeSelect.addEventListener("change", updateRegOptionsVisibility);
      
      // Delay initial check slightly or run after settings are loaded from options.js
      setTimeout(updateRegOptionsVisibility, 50);
    });
  </script>
